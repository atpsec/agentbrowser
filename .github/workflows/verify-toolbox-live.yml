name: Verify everyday toolbox live

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-toolbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Cloudflare deployment
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          for i in $(seq 1 30); do
            page=$(curl -fsS "$base/toolbox/" || true)
            data=$(curl -fsS "$base/toolbox/toolbox-data.js" || true)
            sw=$(curl -fsS "$base/sw.js" || true)
            if printf '%s' "$page" | grep -q 'Her Şey Kutusu' && printf '%s' "$data" | grep -q 'shopping-list' && printf '%s' "$sw" | grep -q 'ai-pusula-v13'; then
              echo 'Toolbox live assets ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for live toolbox assets' >&2
          exit 1
      - name: Verify production security headers
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          curl -fsSI "$base/toolbox/" >/tmp/toolbox.headers
          grep -i -q 'strict-transport-security:.*max-age=31536000' /tmp/toolbox.headers
          grep -i -q 'referrer-policy: no-referrer' /tmp/toolbox.headers
          grep -i -q 'cross-origin-opener-policy: same-origin' /tmp/toolbox.headers
          grep -i -q 'cross-origin-resource-policy: same-origin' /tmp/toolbox.headers
          grep -i -q "content-security-policy:.*script-src 'self'" /tmp/toolbox.headers
          grep -i -q "content-security-policy:.*frame-src 'none'" /tmp/toolbox.headers
          grep -i -q "content-security-policy:.*connect-src 'self'" /tmp/toolbox.headers
          ! grep -i -q 'accounts.google.com' /tmp/toolbox.headers
          githead=$(curl -fsS "$base/.git/HEAD" || true)
          ! printf '%s' "$githead" | grep -Eq '^ref: refs/heads/'
          ! printf '%s' "$githead" | grep -Eq '^[0-9a-fA-F]{40}$'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run production toolbox flows
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const base='https://agentbrowser.tpberg3tp.workers.dev';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];const external=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('request',r=>{const u=new URL(r.url());if(/^https?:/.test(u.protocol)&&u.origin!==base)external.push(r.url())});
          const open=async id=>{await page.goto(`${base}/toolbox/?tool=${id}`,{waitUntil:'networkidle'});await page.locator('#workspace:not([hidden])').waitFor()};
          await page.goto(base+'/toolbox/',{waitUntil:'networkidle'});
          const total=Number((await page.locator('#resultCount').textContent()).match(/\d+/)?.[0]);
          if(total!==208) throw new Error(`Expected 208 live tools, got ${total}`);
          if(await page.locator('[data-cat]').count()!==20) throw new Error('Expected all + 19 category filters');
          await page.fill('#search','kelime');
          if(!(await page.locator('[data-tool="word-count"]').count()))throw new Error('Live search failed');
          await open('shopping-list');await page.locator('.check-row input').first().check();await page.reload({waitUntil:'networkidle'});if(!(await page.locator('.check-row input').first().isChecked()))throw new Error('Live checklist persistence failed');
          await open('percentage');let q=page.locator('#toolBody input[type="number"]');await q.nth(0).fill('250');await q.nth(1).fill('20');await page.locator('#toolBody').getByRole('button',{name:'Hesapla'}).click();if(!(await page.locator('#toolOutput').textContent()).includes('50'))throw new Error('Live percentage failed');
          await open('word-count');await page.locator('#toolBody textarea').fill('bir iki üç dört beş');await page.locator('#toolBody').getByRole('button',{name:'Çalıştır'}).click();if(!(await page.locator('#toolOutput').textContent()).includes('Kelime: 5'))throw new Error('Live word count failed');
          await open('password');await page.locator('#toolBody textarea').fill('24');await page.locator('#toolBody').getByRole('button',{name:'Üret'}).click();if((await page.locator('#toolOutput').textContent()).trim().length<24)throw new Error('Live password generation failed');
          await open('sha256');await page.locator('input[type="file"]').setInputFiles({name:'hello.txt',mimeType:'text/plain',buffer:Buffer.from('hello')});await page.locator('#toolBody').getByRole('button',{name:'SHA-256 hesapla'}).click();await page.waitForFunction(()=>document.querySelector('#toolOutput')?.textContent?.includes('2cf24dba5fb0a30e'));
          await open('trip-fuel');q=page.locator('#toolBody input[type="number"]');if(await q.count()!==3)throw new Error('Live trip fuel inputs missing');await q.nth(0).fill('500');await q.nth(1).fill('7');await q.nth(2).fill('50');await page.locator('#toolBody').getByRole('button',{name:'Hesapla'}).click();if(await page.locator('#toolOutput').isHidden())throw new Error('Live trip fuel failed');
          await page.goto(base+'/',{waitUntil:'networkidle'});if(!(await page.locator('.ph-nav a[href="/toolbox/"]').count()))throw new Error('Live home toolbox nav missing');
          const manifest=await page.evaluate(async()=>await (await fetch('/manifest.webmanifest')).json());if(!manifest.shortcuts.some(x=>x.url==='/toolbox/'))throw new Error('Live PWA toolbox shortcut missing');
          const sw=await page.evaluate(async()=>await (await fetch('/sw.js')).text());if(!sw.includes('ai-pusula-v13'))throw new Error('Live SW v13 missing');
          await page.goto(base+'/toolbox/',{waitUntil:'networkidle'});const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>2)throw new Error(`Live mobile overflow ${overflow}px`);
          const unexpected=external.filter(raw=>{const u=new URL(raw);return !(u.origin==='https://cdn.jsdelivr.net'&&u.pathname==='/npm/simple-icons@v16/icons/openai.svg')});
          if(unexpected.length)throw new Error(`Unexpected toolbox external requests: ${unexpected.join(', ')}`);
          if(errors.length)throw new Error(`Browser errors: ${errors.join(' | ')}`);
          await browser.close();console.log('Production everyday toolbox PASS: 208 tools / 19 categories');
          NODE
