name: E2E product builder

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local site
        run: |
          python3 -m http.server 8080 -d public >/tmp/ai-pusula-builder.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 2
      - name: Verify interactive 18-product builder
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const failures = [];
          page.on('pageerror', error => failures.push(`pageerror: ${error.message}`));
          page.on('console', message => { if (message.type() === 'error') failures.push(`console: ${message.text()}`); });
          await page.goto('http://127.0.0.1:8080/?guide=1#product-builder', { waitUntil: 'networkidle' });
          await page.locator('#product-builder').waitFor({ state: 'visible' });
          if (await page.locator('#builderCatalog [data-builder-open]').count() !== 18) throw new Error('Expected 18 builder cards');
          const ids = await page.locator('#builderCatalog [data-builder-open]').evaluateAll(nodes => nodes.map(node => node.dataset.builderOpen));
          for (const id of ids) {
            await page.locator(`#builderCatalog [data-builder-open="${id}"]`).click();
            await page.locator('#builderDialog[open]').waitFor();
            const selected = await page.locator('[data-builder-product]').inputValue();
            if (selected !== id) throw new Error(`${id}: wrong selected product ${selected}`);
            if (await page.locator('[data-builder-stage]').count() !== 14) throw new Error(`${id}: expected 14 stages`);
            await page.locator('[data-builder-tab="architecture"]').click();
            if (await page.locator('[data-builder-node]').count() < 10) throw new Error(`${id}: architecture incomplete`);
            await page.locator('[data-builder-tab="database"]').click();
            if (await page.locator('[data-builder-entity]').count() < 6) throw new Error(`${id}: database model incomplete`);
            await page.locator('[data-builder-close]').click();
          }
          await page.locator('#builderCatalog [data-builder-open]').first().click();
          await page.locator('[data-builder-tab="roadmap"]').click();
          const before = await page.locator('.builder-progress-card strong').textContent();
          await page.locator('[data-builder-task]').first().check();
          const after = await page.locator('.builder-progress-card strong').textContent();
          if (before === after) throw new Error('Progress did not update');
          await page.locator('[data-builder-tab="tools"]').click();
          await page.locator('[data-builder-profile="pro"]').click();
          if (await page.locator('.builder-tool-grid article').count() < 8) throw new Error('Pro tool profile incomplete');
          await page.reload({ waitUntil: 'networkidle' });
          await page.locator('#builderCatalog [data-builder-open]').first().click();
          if (!(await page.locator('[data-builder-task]').first().isChecked())) throw new Error('Progress did not persist');
          await page.setViewportSize({ width: 390, height: 844 });
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
          if (overflow > 2) throw new Error(`Mobile horizontal overflow: ${overflow}px`);
          if (failures.length) throw new Error(failures.join('\n'));
          await browser.close();
          console.log('18-product builder browser smoke test passed.');
          NODE
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true
