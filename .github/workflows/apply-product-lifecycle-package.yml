name: Apply product lifecycle package

on:
  push:
    branches:
      - 'agent/product-lifecycle-playbooks'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'push' || github.head_ref == 'agent/product-lifecycle-playbooks' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-lifecycle-playbooks
          fetch-depth: 0

      - name: Decode and apply package
        run: |
          set -euo pipefail
          cat > /tmp/expected-package-hashes <<'HASHES'
          6442b3ad5835e86e30044b9e7304fb4061170cd146d804f3ae48e72aefe9ed3c  .ai-pusula-package/part00
          02199721ef0c3a1f1a2faee36c649995967dd6e6a05fd5fd00977a65a54e04c0  .ai-pusula-package/part01
          15154208b8ae146b7b4106d9bc8426f2a40e3196f7c3cbe0a3c44ce927e6f920  .ai-pusula-package/part02
          1d41e4cc7f47fb12ad870e6fc39a1b87280e14b0640c4efda9a40dd5e00e9896  .ai-pusula-package/part03
          ed15fc0952cb7dfd1f7b44f839c81760536a01051cc048ab34391427917e98de  .ai-pusula-package/part04
          6e7c3e6be00ff5aebc2d40cee70aca0341f44dff57ff5faccc863c46e8f10c8b  .ai-pusula-package/part05
          c422c837b43d846a95663810d580601b6f3b3c5c5297de34108842fc394cf66a  .ai-pusula-package/part06
          HASHES
          sha256sum -c /tmp/expected-package-hashes
          cat .ai-pusula-package/part* > /tmp/product-lifecycle-package.b64
          base64 --decode /tmp/product-lifecycle-package.b64 > /tmp/product-lifecycle-package.tgz
          tar -tzf /tmp/product-lifecycle-package.tgz >/tmp/product-package-files.txt
          tar -xzf /tmp/product-lifecycle-package.tgz
          mkdir -p .github/workflows
          mv validate.yml .github/workflows/validate.yml

      - name: Validate applied files
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/product-planner.js
          node - <<'NODE'
          const fs = require('fs');
          for (const file of [
            'public/data/apps.json',
            'public/data/models.json',
            'public/data/ideas.json',
            'public/data/product-journeys.json',
            'public/data/updates.json',
            'public/manifest.webmanifest'
          ]) JSON.parse(fs.readFileSync(file, 'utf8'));
          NODE
          cp public/product-planner.js /tmp/product-planner.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const planner = await import(pathToFileURL('/tmp/product-planner.mjs'));
          const ideas = JSON.parse(fs.readFileSync('public/data/ideas.json', 'utf8')).items;
          const journeys = JSON.parse(fs.readFileSync('public/data/product-journeys.json', 'utf8'));
          const byId = new Map(journeys.items.map(item => [item.id, item]));
          if (ideas.length !== byId.size) throw new Error('Idea and journey counts differ');
          for (const idea of ideas) {
            const journey = byId.get(idea.id);
            if (!journey) throw new Error(`Missing journey for ${idea.id}`);
            for (const route of Object.keys(journeys.routes)) {
              for (const duration of Object.keys(journeys.durations)) {
                for (const budget of Object.keys(journeys.budgets)) {
                  const steps = planner.buildJourneySteps({
                    idea,
                    journey,
                    category: journeys.categories[idea.category],
                    route,
                    duration,
                    budget,
                    config: journeys
                  });
                  if (steps.length !== 9) throw new Error(`${idea.id}: invalid step count`);
                }
              }
            }
          }
          console.log(`Validated ${ideas.length * 4 * 3 * 3} product-plan variants.`);
          NODE
          python3 -m http.server 8080 -d public >/tmp/ai-pusula-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet 'AI PUSULA'
          curl --fail --silent --show-error http://127.0.0.1:8080/data/product-journeys.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/product-planner.js | grep --quiet 'buildJourneySteps'

      - name: Remove staging files
        run: |
          rm -rf .ai-pusula-package
          rm -f .github/workflows/apply-product-lifecycle-package.yml

      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add product lifecycle playbooks [product package applied]"
          git push origin HEAD:agent/product-lifecycle-playbooks
