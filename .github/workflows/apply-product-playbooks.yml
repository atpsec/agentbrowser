name: Apply product playbook package

# All verified archive parts are present; this revision triggers the final apply run.
on:
  push:
    branches:
      - agent/product-playbooks
    paths:
      - '.github/workflows/apply-product-playbooks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product playbook branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-playbooks
          fetch-depth: 0

      - name: Restore verified product playbook package
        run: |
          cat .patch/product-playbooks.part-* | base64 --decode > /tmp/product-playbooks.tar.gz
          echo "6bcc0b48058304c0c1ed7e62dc2ae4cad8fc976266e87a3b74f42a1ccd36f5c0  /tmp/product-playbooks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/product-playbooks.tar.gz -C .
          rm -rf .patch
          rm .github/workflows/apply-product-playbooks.yml

      - name: Commit generated product playbook experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add end-to-end product playbooks"
          git push origin HEAD:agent/product-playbooks
