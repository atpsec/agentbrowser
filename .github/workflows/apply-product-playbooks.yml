name: Apply product playbook package

# The package is applied once on this same-repository branch, then this workflow removes itself.
on:
  push:
    branches:
      - agent/product-playbooks
    paths:
      - '.github/workflows/apply-product-playbooks.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product playbook branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-playbooks
          fetch-depth: 0

      - name: Restore verified product playbook package
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.patch').glob('product-playbooks.part-*'))
          if len(parts) != 14:
              raise SystemExit(f'Expected 14 archive parts, found {len(parts)}')

          expected_lengths = [6000] * 13 + [1336]
          encoded_parts = []
          for index, (path, expected_length) in enumerate(zip(parts, expected_lengths)):
              text = path.read_text(encoding='utf-8').strip()
              # The connector transfer added one accidental Base64 quartet suffix to part 12.
              if index == 12 and len(text) == 6003 and text.endswith('Q=='):
                  text = text[:-3]
              if len(text) != expected_length:
                  raise SystemExit(f'{path} has length {len(text)}; expected {expected_length}')
              encoded_parts.append(text)

          encoded = ''.join(encoded_parts)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_digest = '6bcc0b48058304c0c1ed7e62dc2ae4cad8fc976266e87a3b74f42a1ccd36f5c0'
          if digest != expected_digest:
              raise SystemExit(f'Archive SHA-256 mismatch: {digest}')
          Path('/tmp/product-playbooks.tar.gz').write_bytes(archive)
          print(f'Archive verified: {digest}')
          PY
          tar -xzf /tmp/product-playbooks.tar.gz -C .
          rm -rf .patch
          rm .github/workflows/apply-product-playbooks.yml
          rm -f PRODUCT_PLAYBOOK_PROGRESS.md

      - name: Commit generated product playbook experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add end-to-end product playbooks"
          git push origin HEAD:agent/product-playbooks
