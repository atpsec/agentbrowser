name: Verify journey and easy tools live
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production assets
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          for i in $(seq 1 30); do
            if curl -fsS "$base/journey/journey.js" -o /tmp/journey.js && \
               curl -fsS "$base/easy/easy.js" -o /tmp/easy.js && \
               curl -fsS "$base/launch/launch.js" -o /tmp/launch.js && \
               curl -fsS "$base/studio/studio-plus.js" -o /tmp/studio-plus.js && \
               grep -q 'ai-pusula-journey-v1' /tmp/journey.js && \
               grep -q 'function slim' /tmp/easy.js && \
               grep -q 'PAYMENT_WEBHOOK_SECRET' /tmp/launch.js && \
               grep -q 'project.tar' /tmp/studio-plus.js; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify security headers
        run: |
          set -euo pipefail
          h=$(curl -fsSI https://agentbrowser.tpberg3tp.workers.dev/easy/ | tr -d '\r')
          echo "$h" | grep -qi "content-security-policy:.*script-src 'self'"
          echo "$h" | grep -qi "content-security-policy:.*connect-src 'self'"
          ! curl -fsS https://agentbrowser.tpberg3tp.workers.dev/.git/HEAD
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise live platform
        run: |
          node --input-type=module - <<'NODE'
          import {chromium} from 'playwright';
          const base='https://agentbrowser.tpberg3tp.workers.dev';const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1280,height:900},acceptDownloads:true});const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
          await p.goto(base+'/',{waitUntil:'networkidle'});for(const k of ['journey-hub','easy-hub','launch-hub'])if(await p.locator(`[data-${k}]`).count()!==1)throw new Error(k+' missing');
          await p.goto(base+'/studio/',{waitUntil:'networkidle'});await p.fill('#projectTitle','Canlı Test');await p.click('#buildButton');const dp=p.waitForEvent('download');await p.click('#packageButton');if(!(await dp).suggestedFilename().endsWith('.tar'))throw new Error('package');
          await p.goto(base+'/journey/',{waitUntil:'networkidle'});if(await p.locator('.task').count()!==12)throw new Error('journey');if(!(await p.textContent('#portfolio')).includes('Canlı Test'))throw new Error('portfolio');
          await p.goto(base+'/easy/',{waitUntil:'networkidle'});const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZxHkAAAAASUVORK5CYII=','base64');await p.setInputFiles('#fileInput',{name:'x.png',mimeType:'image/png',buffer:png});await p.waitForFunction(()=>!document.querySelector('#applyButton').disabled);for(const m of ['restore','slim','focus','profile','compress','bw']){await p.click(`[data-mode="${m}"]`);await p.click('#applyButton')}const ph=p.waitForEvent('download');await p.click('#downloadButton');if(!(await ph).suggestedFilename().endsWith('.jpg'))throw new Error('photo');
          await p.goto(base+'/launch/',{waitUntil:'networkidle'});await p.check('input[value="auth"]');await p.check('input[value="ai"]');await p.check('input[value="payment"]');await p.click('#planButton');const env=await p.textContent('#envPlan');if(!env.includes('AUTH_SECRET')||!env.includes('AI_API_KEY')||!env.includes('PAYMENT_WEBHOOK_SECRET'))throw new Error('launch');
          for(const r of ['/journey/','/easy/','/launch/']){await p.goto(base+r,{waitUntil:'networkidle'});await p.setViewportSize({width:390,height:844});if(await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth)>2)throw new Error(r+' overflow')}
          if(errs.length)throw new Error(errs.join('\n'));await b.close();console.log('Live journey/easy/launch verification passed');
          NODE
