name: Validate CSP inline styles

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-csp-style-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check public/app.js
          node --input-type=module --check < public/product-builder.js
          node --check public/product-builder-core.js
          node --check public/ai-build-assistant.js
      - name: Reject JavaScript-created inline styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          failures=[]
          for path in sorted(Path('public').glob('*.js')):
              text=path.read_text(encoding='utf-8')
              if 'style="' in text or "style='" in text:
                  failures.append(f'{path}: inline style attribute string')
              if '.style.' in text:
                  failures.append(f'{path}: direct element.style mutation')
          if failures:
              raise SystemExit('\n'.join(failures))
          app=Path('public/app.js').read_text(encoding='utf-8')
          core=Path('public/product-builder-core.js').read_text(encoding='utf-8')
          css=Path('public/styles.css').read_text(encoding='utf-8')
          builder_css=Path('public/product-builder.css').read_text(encoding='utf-8')
          headers=Path('public/_headers').read_text(encoding='utf-8')
          assert 'csp-progress' in app
          assert 'clipboard-fallback' in app
          assert 'builder-card-progress' in core
          assert '.csp-progress' in css and '.clipboard-fallback' in css
          assert '.builder-card-progress' in builder_css
          assert "style-src 'self'" in headers
          assert "'unsafe-inline'" not in headers
          print('No JavaScript-created inline styles; strict style-src self remains enforced.')
          PY
      - name: Common secret scan
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' public --exclude='*.svg'; then
            echo 'Potential secret found.' >&2
            exit 1
          fi
