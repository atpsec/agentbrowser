name: Apply CSP app fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-csp-app-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace inline progress with native progress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          core_path=Path('public/product-builder-core.js')
          core=core_path.read_text(encoding='utf-8')
          old='<i><u style="width:${progress.percent}%"></u></i><em>${progress.percent}% · İnşa haritasını aç →</em>'
          new='<progress class="builder-card-progress" max="100" value="${progress.percent}" aria-label="${progress.percent}% tamamlandı"></progress><em>${progress.percent}% · İnşa haritasını aç →</em>'
          assert core.count(old)==1
          core_path.write_text(core.replace(old,new),encoding='utf-8')
          css_path=Path('public/product-builder.css')
          css=css_path.read_text(encoding='utf-8')
          addition='\n.builder-card-progress{width:100%;height:8px;border:1px solid var(--ink);appearance:none;background:var(--line)}.builder-card-progress::-webkit-progress-bar{background:var(--line)}.builder-card-progress::-webkit-progress-value{background:var(--blue)}.builder-card-progress::-moz-progress-bar{background:var(--blue)}\n'
          if '.builder-card-progress' not in css:
              css_path.write_text(css+addition,encoding='utf-8')
          PY
          node --check public/product-builder-core.js
          ! grep -q 'style="width:' public/product-builder-core.js
          grep -q 'builder-card-progress' public/product-builder.css
      - name: Commit application fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/product-builder-core.js public/product-builder.css
          git commit -m 'Fix builder progress CSP violation'
          git push origin HEAD:${{ github.head_ref }}
