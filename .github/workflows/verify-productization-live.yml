name: Verify productization live

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Cloudflare deployment
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          for i in $(seq 1 30); do
            root=$(curl -fsS "$base/" || true)
            product=$(curl -fsS "$base/productization.js" || true)
            sw=$(curl -fsS "$base/sw.js" || true)
            if printf '%s' "$root" | grep -q 'AI PUSULA' && printf '%s' "$product" | grep -q 'product-home' && printf '%s' "$sw" | grep -q 'ai-pusula-v12'; then
              echo 'Live assets ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for production assets' >&2
          exit 1
      - name: Verify security headers and isolation
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          curl -fsSI "$base/" > /tmp/root.headers
          curl -fsSI "$base/demo/" > /tmp/demo.headers
          grep -i -q 'strict-transport-security:.*max-age=31536000' /tmp/root.headers
          grep -i -q 'referrer-policy: no-referrer' /tmp/root.headers
          grep -i -q 'cross-origin-opener-policy: same-origin' /tmp/root.headers
          grep -i -q 'cross-origin-resource-policy: same-origin' /tmp/root.headers
          grep -i -q "content-security-policy:.*script-src 'self'" /tmp/root.headers
          grep -i -q "content-security-policy:.*frame-src 'none'" /tmp/root.headers
          grep -i -q 'content-security-policy:.*upgrade-insecure-requests' /tmp/root.headers
          ! grep -i -q 'accounts.google.com' /tmp/root.headers
          grep -i -q 'accounts.google.com/gsi/client' /tmp/demo.headers
          grep -i -q 'cross-origin-opener-policy: same-origin-allow-popups' /tmp/demo.headers
          githead=$(curl -fsS "$base/.git/HEAD" || true)
          ! printf '%s' "$githead" | grep -Eq '^ref: refs/heads/'
          ! printf '%s' "$githead" | grep -Eq '^[0-9a-fA-F]{40}$'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run production browser flows
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base='https://agentbrowser.tpberg3tp.workers.dev';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[]; const external=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('request',r=>{const u=new URL(r.url());if(/^https?:/.test(u.protocol)&&u.origin!==base)external.push(r.url())});
          await page.goto(base+'/',{waitUntil:'networkidle'});
          await page.waitForSelector('.product-home');
          if(await page.locator('.ph-grid4 .ph-card').count()!==4) throw new Error('Four primary paths missing');
          await page.fill('#phSearch','pdf birleştir');
          await page.waitForFunction(()=>document.querySelectorAll('.ph-result').length>0);
          if(!(await page.locator('.ph-result').first().textContent()).includes('PDF')) throw new Error('Tool finder failed');
          let overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          if(overflow>2) throw new Error(`Root mobile overflow ${overflow}px`);
          for(const slug of ['photofix','pdf-toolbox','qr-maker','passport-photo']){
            await page.goto(base+'/a/'+slug+'/',{waitUntil:'networkidle'});
            if(await page.locator('h1').count()!==1) throw new Error('Landing missing '+slug);
            if(await page.locator('.plans .plan').count()!==2) throw new Error('Plans missing '+slug);
            overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>2) throw new Error(`Landing overflow ${slug} ${overflow}px`);
          }
          await page.goto(base+'/account/',{waitUntil:'networkidle'});
          if(!(await page.locator('#mode').textContent()).includes('Gerçek hesap backend')) throw new Error('Account auth boundary missing');
          await page.goto(base+'/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'Gelişmiş AI rehberini aç'}).click();
          const more=page.locator('#showMoreIdeas');
          while(await more.count() && await more.isVisible()) await more.click();
          if(await page.locator('[data-live-product]').count()!==18) throw new Error('Legacy 18-product compatibility failed');
          const manifest=await page.evaluate(async()=>await (await fetch('/manifest.webmanifest')).json());
          if(!manifest.start_url.startsWith('/apps')) throw new Error('PWA start_url compatibility failed');
          if(!manifest.shortcuts.some(x=>x.url==='/kids/')) throw new Error('Kids shortcut missing');
          const rootExternal=external.filter(u=>!u.includes('accounts.google.com'));
          if(rootExternal.length) throw new Error('Unexpected external requests: '+rootExternal.join(','));
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          console.log('Production productization + security flows PASS');
          NODE
