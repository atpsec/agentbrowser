name: Validate product builder

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and JSON syntax
        run: |
          node --input-type=module --check < public/product-builder.js
          node --check public/product-builder-core.js
          node --check public/ai-build-assistant.js
          node -e "JSON.parse(require('fs').readFileSync('public/data/build-blueprints.json','utf8')); console.log('blueprints json ok')"
      - name: Validate 18-product blueprint coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('public/data/build-blueprints.json').read_text(encoding='utf-8'))
          ideas = json.loads(Path('public/data/ideas.json').read_text(encoding='utf-8'))['items']
          assert data['version'] == 2
          products = data['products']
          assert len(products) == 18, len(products)
          idea_ids = {item['id'] for item in ideas}
          product_ids = {item['id'] for item in products}
          assert product_ids == idea_ids, (sorted(idea_ids - product_ids), sorted(product_ids - idea_ids))
          assert {'minimum','balanced','pro'} == set(data['profiles'])
          required = {'id','title','category','target','promise','roles','pages','entities','aiFeatures','securityFocus','billing','storage','specialTools'}
          for product in products:
              assert required <= set(product), product['id']
              assert len(product['roles']) >= 2
              assert len(product['pages']) >= 6
              assert len(product['entities']) >= 6
              assert len(product['aiFeatures']) >= 3
              assert len(product['securityFocus']) >= 3
              for tool in product['specialTools']:
                  assert tool in data['tools'], (product['id'], tool)
          for profile in data['profiles'].values():
              for tool in profile['tools']:
                  assert tool in data['tools'], tool
          for key, tool in data['tools'].items():
              assert tool['official'].startswith('https://'), key
          print('18/18 product-specific blueprints and tool references verified.')
          PY
      - name: Security boundary checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          loader = Path('public/product-builder.js').read_text(encoding='utf-8')
          core = Path('public/product-builder-core.js').read_text(encoding='utf-8')
          assistant = Path('public/ai-build-assistant.js').read_text(encoding='utf-8')
          js = loader + '\n' + core + '\n' + assistant
          html = Path('public/index.html').read_text(encoding='utf-8')
          headers = Path('public/_headers').read_text(encoding='utf-8')
          wrangler = Path('wrangler.jsonc').read_text(encoding='utf-8')
          forbidden = ['eval(', 'new Function(', 'document.write(', ' onerror=', 'innerHTML = location', 'localStorage.setItem("token"', 'localStorage.setItem(\'token\'']
          for value in forbidden:
              assert value not in js, value
          assert "./product-builder-core.js" in loader
          assert "./ai-build-assistant.js" in loader
          assert 'product-builder.css' in html
          assert 'product-builder.js' in html
          assert "script-src 'self'" in headers
          assert "connect-src 'self'" in headers
          assert "frame-ancestors 'none'" in headers
          assert "object-src 'none'" in headers
          assert '"directory": "./public"' in wrangler
          assert "fetch('./data/build-blueprints.json'" in core
          assert "fetch('./data/ideas.json'" in core
          assert "fetch('./data/build-blueprints.json'" in assistant
          assert "fetch('http" not in assistant and 'fetch("http' not in assistant
          print('CSP, local fetch boundaries, module loader and deployment scope verified.')
          PY
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' public --exclude='*.svg'; then
            echo 'Potential secret found.' >&2
            exit 1
          fi
      - name: Validate generated 14-stage contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('public/product-builder-core.js','utf8');
          const requiredStages = ['scope','ux','foundation','auth','database','frontend','backend','ai','billing','email','observability','security','deploy','growth'];
          for (const id of requiredStages) {
            if (!src.includes(`id:'${id}'`)) throw new Error(`Missing generated stage ${id}`);
          }
          if (!src.includes("number:'14'")) throw new Error('14th stage missing');
          console.log('14-stage generator contract verified.');
          NODE
      - name: HTTP smoke test
        run: |
          python3 -m http.server 8080 -d public >/tmp/builder-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8080/ | grep --quiet 'product-builder.js'
          curl --fail --silent http://127.0.0.1:8080/data/build-blueprints.json | grep --quiet 'phishing-explainer'
          curl --fail --silent http://127.0.0.1:8080/data/build-blueprints.json | grep --quiet 'social-calendar'
          curl --fail --silent http://127.0.0.1:8080/product-builder.js | grep --quiet 'product-builder-core.js'
          curl --fail --silent http://127.0.0.1:8080/product-builder-core.js | grep --quiet 'initBuilder'
          curl --fail --silent http://127.0.0.1:8080/ai-build-assistant.js | grep --quiet 'AI Pusula'
