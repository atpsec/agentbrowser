name: Verify demo live

on:
  push:
    branches: ['ops/verify-demo-live']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-demo-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Cloudflare deployment
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          for i in $(seq 1 30); do
            demo=$(curl -fsS "$base/demo/" || true)
            session=$(curl -fsS "$base/demo-session.js" || true)
            sw=$(curl -fsS "$base/sw.js" || true)
            if printf '%s' "$demo" | grep -q 'DEMO MERKEZİ' && printf '%s' "$session" | grep -q "SESSION_KEY='ai-pusula-demo-session-v1'" && printf '%s' "$sw" | grep -q "ai-pusula-v11"; then
              echo 'Live assets ready'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for live demo assets' >&2
          exit 1
      - name: Verify production headers and repository isolation
        run: |
          set -euo pipefail
          base='https://agentbrowser.tpberg3tp.workers.dev'
          curl -fsSI "$base/" > /tmp/root.headers
          curl -fsSI "$base/demo/" > /tmp/demo.headers
          grep -i -q "content-security-policy:.*script-src 'self'" /tmp/root.headers
          ! grep -i -q 'accounts.google.com' /tmp/root.headers
          grep -i -q 'content-security-policy:.*accounts.google.com/gsi/client' /tmp/demo.headers
          grep -i -q 'content-security-policy:.*accounts.google.com/gsi/' /tmp/demo.headers
          grep -i -q 'cross-origin-opener-policy: same-origin-allow-popups' /tmp/demo.headers
          githead=$(curl -fsS "$base/.git/HEAD" || true)
          ! printf '%s' "$githead" | grep -Eq '^ref: refs/heads/'
          ! printf '%s' "$githead" | grep -Eq '^[0-9a-fA-F]{40}$'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run live demo flows
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base='https://agentbrowser.tpberg3tp.workers.dev';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[]; const external=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('request',r=>{const u=new URL(r.url());if(u.origin!==base&&/^https?:/.test(u.protocol))external.push(r.url())});
          await page.goto(base+'/demo/',{waitUntil:'networkidle'});
          await page.click('#demoLogin');
          if(await page.locator('#profile').isHidden()) throw new Error('Demo profile did not open');
          if(!(await page.locator('#authStatus').textContent()).includes('aktif')) throw new Error('Demo session inactive');
          if(!(await page.locator('#googleLogin').isDisabled())) throw new Error('Google must stay disabled without client id');
          await page.goto(base+'/easy/');
          await page.getByRole('button',{name:'Demo verisini yükle'}).click();
          await page.waitForFunction(()=>document.querySelector('#fileInput')?.files?.length===1);
          if(!(await page.locator('#jsonOutput').inputValue()).includes('AI Pusula Tools')) throw new Error('Easy JSON demo missing');
          if(!(await page.locator('#textOutput').inputValue()).includes('AI Pusula')) throw new Error('Easy text demo missing');
          await page.goto(base+'/easy/qr/');
          await page.getByRole('button',{name:'Demo verisini yükle'}).click();
          await page.waitForFunction(()=>document.querySelector('#downloadQr')?.disabled===false);
          await page.goto(base+'/easy/pdf/');
          await page.getByRole('button',{name:'Demo verisini yükle'}).click();
          await page.waitForFunction(()=>document.querySelector('#mergeInput')?.files?.length===2);
          if(await page.locator('#splitInput').evaluate(e=>e.files.length)!==1) throw new Error('PDF split demo missing');
          await page.goto(base+'/easy/photo-studio/');
          await page.getByRole('button',{name:'Demo verisini yükle'}).click();
          await page.waitForFunction(()=>document.querySelector('#photoInput')?.files?.length===1&&document.querySelector('#collageInput')?.files?.length===2);
          await page.waitForFunction(()=>document.querySelector('#addText')?.disabled===false);
          const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          if(overflow>2) throw new Error(`Mobile overflow ${overflow}px`);
          if(external.length) throw new Error(`Unexpected external requests: ${external.join(', ')}`);
          if(errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
          await browser.close();
          console.log('Live demo login + four seeded app flows PASS');
          NODE
