name: Vendor Easy dependencies
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-easy-deps.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download pinned browser libraries
        run: |
          set -euo pipefail
          mkdir -p public/vendor
          curl -fsSL 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js' -o public/vendor/pdf-lib.min.js
          actual=$(openssl dgst -sha512 -binary public/vendor/pdf-lib.min.js | openssl base64 -A)
          test "$actual" = 'z8IYLHO8bTgFqj+yrPyIJnzBDf7DDhWwiEsk4sY+Oe6J2M+WQequeGS7qioI5vT6rXgVRb4K1UVQC5ER7MKzKQ=='
          curl -fsSL 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js' -o public/vendor/qrcode-generator.min.js
          test -s public/vendor/qrcode-generator.min.js
          printf '%s\n' 'pdf-lib 1.17.1 - MIT - https://github.com/Hopding/pdf-lib' 'qrcode-generator 1.4.4 - MIT - https://github.com/kazuhikoarase/qrcode-generator' > public/vendor/THIRD_PARTY.txt
      - name: Commit vendored libraries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vendor/pdf-lib.min.js public/vendor/qrcode-generator.min.js public/vendor/THIRD_PARTY.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor pinned Easy browser dependencies'
          git push origin HEAD:${{ github.ref_name }}
